---
# =============================================================================
# Kubernetes Configuration
# =============================================================================
K8S_VERSION: 1.30.1-1.1
K8S_API_SERVER_PORT: 6443

# =============================================================================
# Network Configuration
# =============================================================================
VIRTUAL_IP: "192.168.122.100"
VIRTUAL_IP_PORT: 6443
IP_HOST_LB1: 192.168.122.51
IP_HOST_LB2: 192.168.122.52
IP_HOST_CP1: 192.168.122.101
IP_HOST_CP2: 192.168.122.102
IP_HOST_CP3: 192.168.122.103
IP_HOST_W1: 192.168.122.201

# =============================================================================
# Pod Network Configuration
# =============================================================================
POD_CIDR_FLANNEL: 10.244.0.0/16
POD_CIDR_CALICO: 192.168.0.0/16
VERSION_CALICO: "v3.26.1"

# =============================================================================
# MetalLB Configuration
# =============================================================================
METALLB_VERSION: "v0.15.2"
METALLB_IP_RANGE: "192.168.122.240-192.168.122.250"  # Default range, will be overridden by Terraform

# =============================================================================
# Cert-Manager Configuration
# =============================================================================
CERT_MANAGER_VERSION: "v1.15.3"
CERT_MANAGER_ENABLED: true
LETSENCRYPT_EMAIL: ""  # Will be set by pipeline parameter
LETSENCRYPT_STAGING: true  # Use staging by default for testing

# =============================================================================
# Authentication
# =============================================================================
PASSWORD_KUBEADMIN: "kubeadmin"
PASSWORD_KEEPALIVED: "fW/19P0JzwNqIveyXfnhLXswVBUSFF4d3oMyVSi3g/U="
ansible_python_interpreter: /usr/bin/python3

# =============================================================================
# Distribution-Specific Configuration
# =============================================================================
# These will be set dynamically based on detected/selected distribution
distro_config:
  package_manager: "apt"  # apt, dnf, yum, zypper
  family: "debian"        # debian, rhel, suse
  default_user: "ubuntu"  # ubuntu, centos, rocky, debian, opensuse
  ssh_service: "ssh"      # ssh, sshd

# Package mappings for different distributions
packages:
  debian_family:
    basic: ["curl", "wget", "ca-certificates", "apt-transport-https", "gnupg", "lsb-release"]
    docker: ["docker.io", "docker-compose"]
    k8s: ["kubelet", "kubeadm", "kubectl"]
  rhel_family:
    basic: ["curl", "wget", "ca-certificates"]
    docker: ["docker", "docker-compose"]
    k8s: ["kubelet", "kubeadm", "kubectl"]
  suse_family:
    basic: ["curl", "wget", "ca-certificates"]
    docker: ["docker", "docker-compose"]
    k8s: ["kubelet", "kubeadm", "kubectl"]

# =============================================================================
# VM IPs (will be updated by Jenkins/Terraform)
# =============================================================================
vm_ips:
  kcontrolplane1: "192.168.122.101"
  kcontrolplane2: "192.168.122.102"
  kcontrolplane3: "192.168.122.103"
  kworker1: "192.168.122.201"
  kworker2: "192.168.122.202"
  kworker3: "192.168.122.203"
  loadbalancer1: "192.168.122.51"
  loadbalancer2: "192.168.122.52"
