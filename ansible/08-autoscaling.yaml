---
- name: Install and Configure Kubernetes Autoscaling
  hosts: kcontrolplane
  become: yes
  gather_facts: yes
  vars_files:
    - vars.yaml

  tasks:
    - name: Install autoscaling components
      block:
        - name: Install metrics server
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: kube-system
          when: ansible_hostname == groups['kcontrolplane'][0]

        - name: Apply metrics server manifests
          kubernetes.core.k8s:
            state: present
            src: https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          when: ansible_hostname == groups['kcontrolplane'][0]

        - name: Patch metrics server for self-signed certificates
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: metrics-server
                namespace: kube-system
              spec:
                template:
                  spec:
                    containers:
                      - name: metrics-server
                        args:
                          - --kubelet-insecure-tls
          when: ansible_hostname == groups['kcontrolplane'][0]

        - name: Create cluster autoscaler namespace
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: cluster-autoscaler
          when: ansible_hostname == groups['kcontrolplane'][0]

        - name: Create cluster autoscaler service account
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: cluster-autoscaler
                namespace: cluster-autoscaler
                labels:
                  k8s-addon: cluster-autoscaler.addons.k8s.io
                  k8s-app: cluster-autoscaler
          when: ansible_hostname == groups['kcontrolplane'][0]

        - name: Create cluster autoscaler cluster role
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: cluster-autoscaler
                labels:
                  k8s-addon: cluster-autoscaler.addons.k8s.io
                  k8s-app: cluster-autoscaler
              rules:
                - apiGroups: [""]
                  resources: ["events", "endpoints"]
                  verbs: ["create", "patch"]
                - apiGroups: [""]
                  resources: ["pods/eviction"]
                  verbs: ["create"]
                - apiGroups: [""]
                  resources: ["pods/status"]
                  verbs: ["update"]
                - apiGroups: [""]
                  resources: ["endpoints"]
                  resourceNames: ["cluster-autoscaler"]
                  verbs: ["get", "update"]
                - apiGroups: [""]
                  resources: ["nodes"]
                  verbs: ["watch", "list", "get", "update"]
                - apiGroups: [""]
                  resources: ["namespaces", "pods", "services", "replicationcontrollers", "persistentvolumeclaims", "persistentvolumes"]
                  verbs: ["watch", "list", "get"]
                - apiGroups: ["extensions"]
                  resources: ["replicasets", "daemonsets"]
                  verbs: ["watch", "list", "get"]
                - apiGroups: ["policy"]
                  resources: ["poddisruptionbudgets"]
                  verbs: ["watch", "list"]
                - apiGroups: ["apps"]
                  resources: ["statefulsets", "replicasets", "daemonsets"]
                  verbs: ["watch", "list", "get"]
                - apiGroups: ["storage.k8s.io"]
                  resources: ["storageclasses", "csinodes", "csidrivers", "csistoragecapacities"]
                  verbs: ["watch", "list", "get"]
                - apiGroups: ["batch", "extensions"]
                  resources: ["jobs"]
                  verbs: ["get", "list", "watch", "patch"]
                - apiGroups: ["coordination.k8s.io"]
                  resources: ["leases"]
                  verbs: ["create"]
                - apiGroups: ["coordination.k8s.io"]
                  resourceNames: ["cluster-autoscaler"]
                  resources: ["leases"]
                  verbs: ["get", "update"]
          when: ansible_hostname == groups['kcontrolplane'][0]

        - name: Create cluster autoscaler role
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: cluster-autoscaler
                namespace: cluster-autoscaler
                labels:
                  k8s-addon: cluster-autoscaler.addons.k8s.io
                  k8s-app: cluster-autoscaler
              rules:
                - apiGroups: [""]
                  resources: ["configmaps"]
                  verbs: ["create","list","watch"]
                - apiGroups: [""]
                  resources: ["configmaps"]
                  resourceNames: ["cluster-autoscaler-status", "cluster-autoscaler-priority-expander"]
                  verbs: ["delete", "get", "update", "watch"]
          when: ansible_hostname == groups['kcontrolplane'][0]

        - name: Create cluster autoscaler cluster role binding
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: cluster-autoscaler
                labels:
                  k8s-addon: cluster-autoscaler.addons.k8s.io
                  k8s-app: cluster-autoscaler
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: cluster-autoscaler
              subjects:
                - kind: ServiceAccount
                  name: cluster-autoscaler
                  namespace: cluster-autoscaler
          when: ansible_hostname == groups['kcontrolplane'][0]

        - name: Create cluster autoscaler role binding
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: cluster-autoscaler
                namespace: cluster-autoscaler
                labels:
                  k8s-addon: cluster-autoscaler.addons.k8s.io
                  k8s-app: cluster-autoscaler
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: cluster-autoscaler
              subjects:
                - kind: ServiceAccount
                  name: cluster-autoscaler
                  namespace: cluster-autoscaler
          when: ansible_hostname == groups['kcontrolplane'][0]

        - name: Create cluster autoscaler deployment
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: cluster-autoscaler
                namespace: cluster-autoscaler
                labels:
                  app: cluster-autoscaler
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: cluster-autoscaler
                template:
                  metadata:
                    labels:
                      app: cluster-autoscaler
                  spec:
                    serviceAccountName: cluster-autoscaler
                    containers:
                      - image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.30.1
                        name: cluster-autoscaler
                        resources:
                          limits:
                            cpu: 100m
                            memory: 300Mi
                          requests:
                            cpu: 100m
                            memory: 300Mi
                        command:
                          - ./cluster-autoscaler
                          - --v=4
                          - --stderrthreshold=info
                          - --cloud-provider=libvirt
                          - --nodes=1:10:kworker
                          - --scale-down-delay-after-add=10m
                          - --scale-down-delay-after-delete=10s
                          - --scale-down-delay-after-failure=3m
                          - --scale-down-unneeded-time=10m
                          - --max-node-provision-time=15m
                          - --ok-total-unready-count=3
                          - --max-total-unready-percentage=45
                          - --scale-down-enabled=true
                          - --scale-down-utilization-threshold=0.5
                          - --skip-nodes-with-local-storage=false
                          - --skip-nodes-with-system-pods=false
                          - --balance-similar-node-groups=true
                          - --expander=least-waste
                          - --node-group-auto-discovery=asg:tag=k8s.io/cluster-autoscaler/node-template/label/node.kubernetes.io/instance-type
                        volumeMounts:
                          - name: ssl-certs
                            mountPath: /etc/ssl/certs/ca-bundle.crt
                            readOnly: true
                        imagePullPolicy: "Always"
                    volumes:
                      - name: ssl-certs
                        hostPath:
                          path: "/etc/ssl/certs/ca-bundle.crt"
          when: ansible_hostname == groups['kcontrolplane'][0]

        - name: Create cluster autoscaler config map
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: cluster-autoscaler-status
                namespace: cluster-autoscaler
              data:
                status: "true"
          when: ansible_hostname == groups['kcontrolplane'][0]

    - name: Wait for metrics server to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: kube-system
        label_selectors:
          - k8s-app=metrics-server
      register: metrics_server_pods
      until: metrics_server_pods.resources | length > 0 and metrics_server_pods.resources[0].status.phase == 'Running'
      retries: 30
      delay: 10
      when: ansible_hostname == groups['kcontrolplane'][0]

    - name: Wait for cluster autoscaler to be ready
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: cluster-autoscaler
        label_selectors:
          - app=cluster-autoscaler
      register: cluster_autoscaler_pods
      until: cluster_autoscaler_pods.resources | length > 0 and cluster_autoscaler_pods.resources[0].status.phase == 'Running'
      retries: 30
      delay: 10
      when: ansible_hostname == groups['kcontrolplane'][0]

    - name: Create sample applications for testing
      block:
        - name: Create hpa-demo namespace
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: hpa-demo

        - name: Create test deployment
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: autoscaling-test
                namespace: hpa-demo
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: autoscaling-test
                template:
                  metadata:
                    labels:
                      app: autoscaling-test
                  spec:
                    containers:
                      - name: stress-test
                        image: busybox:latest
                        command: ["/bin/sh"]
                        args: ["-c", "while true; do echo 'Running stress test'; sleep 30; done"]
                        resources:
                          requests:
                            memory: "100Mi"
                            cpu: "100m"
                          limits:
                            memory: "200Mi"
                            cpu: "200m"

        - name: Create HPA for test deployment
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: autoscaling/v2
              kind: HorizontalPodAutoscaler
              metadata:
                name: autoscaling-test-hpa
                namespace: hpa-demo
              spec:
                scaleTargetRef:
                  apiVersion: apps/v1
                  kind: Deployment
                  name: autoscaling-test
                minReplicas: 1
                maxReplicas: 10
                metrics:
                  - type: Resource
                    resource:
                      name: cpu
                      target:
                        type: Utilization
                        averageUtilization: 50
                  - type: Resource
                    resource:
                      name: memory
                      target:
                        type: Utilization
                        averageUtilization: 50
                behavior:
                  scaleDown:
                    stabilizationWindowSeconds: 300
                    policies:
                      - type: Percent
                        value: 10
                        periodSeconds: 60
                  scaleUp:
                    stabilizationWindowSeconds: 60
                    policies:
                      - type: Percent
                        value: 100
                        periodSeconds: 15
      when: ansible_hostname == groups['kcontrolplane'][0]

    - name: Display autoscaling status
      debug:
        msg: |
          ✅ Autoscaling components installed successfully!
          
          📊 Available commands:
          - kubectl get hpa -A
          - kubectl top nodes
          - kubectl top pods -A
          - kubectl logs -f deployment/cluster-autoscaler -n cluster-autoscaler
          
          🧪 Test autoscaling:
          - kubectl scale deployment autoscaling-test --replicas=5 -n hpa-demo
      when: ansible_hostname == groups['kcontrolplane'][0]
