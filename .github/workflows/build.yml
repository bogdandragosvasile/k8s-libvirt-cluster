name: Build and Test

on:
  push:
    branches: [ main, master, feature/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Validate prerequisites scripts
      run: |
        echo "🔍 Validating prerequisites scripts..."
        
        # Check if all scripts exist and are executable
        scripts=(
          "prerequisites/install.sh"
          "prerequisites/scripts/01-system-update.sh"
          "prerequisites/scripts/02-libvirt-setup.sh"
          "prerequisites/scripts/03-docker-setup.sh"
          "prerequisites/scripts/04-jenkins-setup.sh"
          "prerequisites/scripts/05-kubernetes-tools.sh"
          "prerequisites/scripts/06-terraform-setup.sh"
          "prerequisites/scripts/07-development-tools.sh"
          "prerequisites/scripts/08-final-config.sh"
        )
        
        for script in "${scripts[@]}"; do
          if [[ -f "$script" ]]; then
            echo "✅ $script exists"
          else
            echo "❌ $script missing"
            exit 1
          fi
        done
        
        echo "✅ All prerequisites scripts validated"
        
    - name: Validate Jenkins scripts
      run: |
        echo "🔍 Validating Jenkins scripts..."
        
        # Check Jenkins-related files
        jenkins_files=(
          "scripts/jenkins/create_api_token.py"
          "scripts/jenkins/create_api_token.sh"
          "scripts/jenkins/README.md"
          "jenkins/Jenkinsfile"
        )
        
        for file in "${jenkins_files[@]}"; do
          if [[ -f "$file" ]]; then
            echo "✅ $file exists"
          else
            echo "❌ $file missing"
            exit 1
          fi
        done
        
        echo "✅ All Jenkins scripts validated"
        
    - name: Validate Terraform configuration
      run: |
        echo "🔍 Validating Terraform configuration..."
        
        # Check Terraform files
        terraform_files=(
          "terraform/main.tf"
          "terraform/variables.tf"
          "terraform/outputs.tf"
          "terraform/inventory.tpl"
          "terraform/cloud_init_user_data.tpl"
          "terraform/cloud_init_network_config.tpl"
        )
        
        for file in "${terraform_files[@]}"; do
          if [[ -f "$file" ]]; then
            echo "✅ $file exists"
          else
            echo "❌ $file missing"
            exit 1
          fi
        done
        
        echo "✅ All Terraform files validated"
        
    - name: Validate Ansible configuration
      run: |
        echo "🔍 Validating Ansible configuration..."
        
        # Check Ansible files
        ansible_files=(
          "ansible/main.yaml"
          "ansible/vars.yaml"
          "ansible/01-initial.yaml"
          "ansible/02-packages.yaml"
          "ansible/03-lb.yaml"
          "ansible/04-k8s.yaml"
          "ansible/05-control-plane.yaml"
          "ansible/06-worker.yaml"
          "ansible/07-k8s-config.yaml"
        )
        
        for file in "${ansible_files[@]}"; do
          if [[ -f "$file" ]]; then
            echo "✅ $file exists"
          else
            echo "❌ $file missing"
            exit 1
          fi
        done
        
        echo "✅ All Ansible files validated"
        
    - name: Test Python scripts
      run: |
        echo "🔍 Testing Python scripts..."
        
        # Test Jenkins API token creation script
        if [[ -f "scripts/jenkins/create_api_token.py" ]]; then
          echo "✅ Testing create_api_token.py syntax..."
          python -m py_compile scripts/jenkins/create_api_token.py
          echo "✅ create_api_token.py syntax is valid"
        fi
        
        # Test create_jenkins_token.py if it exists
        if [[ -f "create_jenkins_token.py" ]]; then
          echo "✅ Testing create_jenkins_token.py syntax..."
          python -m py_compile create_jenkins_token.py
          echo "✅ create_jenkins_token.py syntax is valid"
        fi
        
    - name: Validate documentation
      run: |
        echo "🔍 Validating documentation..."
        
        # Check documentation files
        docs_files=(
          "README.md"
          "CHANGELOG.md"
          "prerequisites/README.md"
          "scripts/jenkins/README.md"
        )
        
        for file in "${docs_files[@]}"; do
          if [[ -f "$file" ]]; then
            echo "✅ $file exists"
            # Check if file has content
            if [[ -s "$file" ]]; then
              echo "✅ $file has content"
            else
              echo "❌ $file is empty"
              exit 1
            fi
          else
            echo "❌ $file missing"
            exit 1
          fi
        done
        
        echo "✅ All documentation files validated"
        
    - name: Build summary
      run: |
        echo "🎉 Build completed successfully!"
        echo ""
        echo "📊 Build Summary:"
        echo "✅ Prerequisites system: 10 files validated"
        echo "✅ Jenkins integration: 4 files validated"
        echo "✅ Terraform configuration: 6 files validated"
        echo "✅ Ansible configuration: 9 files validated"
        echo "✅ Python scripts: Syntax validated"
        echo "✅ Documentation: 4 files validated"
        echo ""
        echo "🚀 Ready for deployment!"
